# Render Blueprint for InsureFlow
# Provisions a managed PostgreSQL database and deploys the FastAPI container.
services:
  - type: web
    name: insureflow-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insureflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://insureflow.vercel.app,https://*.vercel.app"
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_ACCESS_CODE
        value: "insureflow-demo"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: DEFAULT_SEED
        value: "20261022"

databases:
  - name: insureflow-db
    databaseName: insureflow
    user: insureflow
    plan: free

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: insureflow-db
    environment:
      POSTGRES_USER: insureflow
      POSTGRES_PASSWORD: insureflow_secure_password
      POSTGRES_DB: insureflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureflow -d insureflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insureflow-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://insureflow:insureflow_secure_password@db:5432/insureflow
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
      SESSION_SECRET: dev-secret-change-in-production
      STAFF_ACCESS_CODE: insureflow-demo
      DEFAULT_SEED: 20261022
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    container_name: insureflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

